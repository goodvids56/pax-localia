name: Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CI: 'true'
  ELECTRON_DISABLE_TELEMETRY: '1'
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install pinned pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false

      - name: Install pinned Node and restore pnpm store
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and security tests with coverage
        run: pnpm test

      - name: Electron ABI integration tests
        run: pnpm test:integration

      - name: Validate scenarios, packages, checksums, and licenses
        run: pnpm validate

      - name: Production package build
        run: pnpm build

      - name: Upload sanitized failure reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage/coverage-summary.json
            test-results/**
            playwright-report/**
          if-no-files-found: warn
          retention-days: 7

  e2e:
    name: Electron smoke flow
    needs:
      - quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install pinned pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false

      - name: Install pinned Node and restore pnpm store
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Run deterministic Electron E2E
        run: xvfb-run -a pnpm test:e2e

      - name: Upload Playwright evidence on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/**
            playwright-report/**
          if-no-files-found: error
          retention-days: 7

  package:
    name: Package ${{ matrix.os_name }} ${{ matrix.arch }}
    needs:
      - quality
      - e2e
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            os_name: windows
            arch: x64
          - runner: ubuntu-24.04
            os_name: linux
            arch: x64
          - runner: macos-15
            os_name: macos
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out exact commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install pinned pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false

      - name: Install pinned Node and restore pnpm store
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Linux maker and smoke prerequisites
        if: matrix.os_name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes fakeroot rpm xvfb

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild native dependency for Electron ABI
        run: pnpm exec electron-rebuild --force --only better-sqlite3 --arch=${{ matrix.arch }}

      - name: Create native distributables
        run: pnpm exec electron-forge make --arch=${{ matrix.arch }}

      - name: Smoke test packaged application
        if: matrix.os_name != 'linux'
        run: pnpm smoke:packaged

      - name: Smoke test packaged application on Xvfb
        if: matrix.os_name == 'linux'
        run: xvfb-run -a pnpm smoke:packaged

      - name: Name and checksum final artifacts
        id: metadata
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          SHORT_SHA="${GITHUB_SHA:0:8}"
          NAME="pax-localia-${VERSION}-${{ matrix.os_name }}-${{ matrix.arch }}-${SHORT_SHA}-unsigned"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          node scripts/collect-artifacts.mjs \
            --os=${{ matrix.os_name }} \
            --arch=${{ matrix.arch }} \
            --sha="${GITHUB_SHA}"

      - name: Upload final unsigned artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.metadata.outputs.name }}
          path: artifacts/${{ steps.metadata.outputs.name }}/**
          if-no-files-found: error
          retention-days: 21
          compression-level: 0
